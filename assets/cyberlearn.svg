<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="302" viewBox="0 0 1200 302" role="img" aria-label="CyberLearn — уроки и задания по кибербезопасности"><title>CyberLearn — уроки и задания по кибербезопасности</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:DejaVu Sans Mono,monospace}.scene{animation:scene 15s infinite;opacity:0}.scene0{animation-delay:0s}.scene1{animation-delay:-10s}.scene2{animation-delay:-5s}@keyframes scene{0%,31%{opacity:1}33.333%,100%{opacity:0}}.line{animation:reveal 5s infinite}.line1{animation-delay:.35s}.line2{animation-delay:.7s}.line3{animation-delay:1.05s}@keyframes reveal{0%,8%{opacity:0}16%,94%{opacity:1}100%{opacity:0}}.progress{transform-origin:551px 273px;animation:progress 5s linear infinite}@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.scene,.line{animation:none}.scene0{opacity:1}}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}@media(prefers-reduced-motion:no-preference){.still{display:none}}</style>
<rect x="1" y="1" width="1198" height="300" rx="24" fill="#000" stroke="#fff"/><text x="36" y="43" fill="#fff" font-size="17" class="mono" letter-spacing="2">02 / CYBERSECURITY</text><text x="34" y="123" fill="#fff" font-size="57" font-weight="700" letter-spacing="-2">CyberLearn</text><text x="38" y="176" fill="#fff" font-size="27" >Уроки и задания</text><text x="38" y="211" fill="#fff" font-size="27" >по кибербезопасности.</text><text x="38" y="268" fill="#fff" font-size="16" class="mono">PYTHON / JAVASCRIPT / HTML / CSS</text><rect x="550" y="25" width="620" height="252" rx="12" fill="#000" stroke="#fff"/><path d="M550 68H1170" stroke="#fff"/><circle cx="574" cy="46" r="5" fill="#fff"/><circle cx="594" cy="46" r="5" fill="#fff"/><circle cx="614" cy="46" r="5" fill="#000"/><text x="647" y="52" fill="#fff" font-size="16" class="mono">terminal / 127.0.0.1</text><g class="scene scene0"><text x="577" y="101" fill="#fff" font-size="21" class="mono">TCP CONNECT / DISCOVERY</text><text x="577" y="139" fill="#fff" font-size="20" class="mono line line0">[init] loading scanner ...</text><text x="577" y="170" fill="#fff" font-size="20" class="mono line line1">[scan] 127.0.0.1</text><text x="577" y="201" fill="#fff" font-size="20" class="mono line line2">[open] 22/tcp    80/tcp</text><text x="577" y="232" fill="#fff" font-size="20" class="mono line line3">[done] service map ready</text></g><g class="scene scene1"><text x="577" y="101" fill="#fff" font-size="21" class="mono">WIRESHARK / PACKET VIEW</text><text x="577" y="139" fill="#fff" font-size="20" class="mono line line0">[init] opening capture ...</text><text x="577" y="170" fill="#fff" font-size="20" class="mono line line1">[flow] DNS  →  TCP  →  TLS</text><text x="577" y="201" fill="#fff" font-size="20" class="mono line line2">[read] packets → sessions</text><text x="577" y="232" fill="#fff" font-size="20" class="mono line line3">[done] traffic decoded</text></g><g class="scene scene2"><text x="577" y="101" fill="#fff" font-size="21" class="mono">SURICATA / EVENT STREAM</text><text x="577" y="139" fill="#fff" font-size="20" class="mono line line0">[init] loading rules ...</text><text x="577" y="170" fill="#fff" font-size="20" class="mono line line1">[read] parsing events.json</text><text x="577" y="201" fill="#fff" font-size="20" class="mono line line2">[view] DNS · HTTP · TLS</text><text x="577" y="232" fill="#fff" font-size="20" class="mono line line3">[done] events correlated</text></g><rect x="550" y="273" width="620" height="2" fill="#000"/><rect class="progress motion" x="551" y="273" width="618" height="2" fill="#fff"/></svg>